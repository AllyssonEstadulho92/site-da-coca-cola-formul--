name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate project
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload validated static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test published Operations UI
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          ok=0
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${base}/" -o /tmp/pages-index.html \
              && grep -q 'V6.1.0 · operations UI' /tmp/pages-index.html \
              && grep -q 'js/app-statistics.js' /tmp/pages-index.html \
              && grep -q 'css/coca-cola-ui.css' /tmp/pages-index.html \
              && ! grep -q 'js/equipment/' /tmp/pages-index.html \
              && curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${base}/js/app-statistics.js" -o /tmp/statistics.js \
              && grep -q 'renderStatistics' /tmp/statistics.js \
              && curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${base}/css/coca-cola-ui.css" -o /tmp/operations.css \
              && grep -q 'ops-metric-grid' /tmp/operations.css \
              && grep -q 'stats-grid' /tmp/operations.css; then
              ok=1
              break
            fi
            echo "Página ainda não propagada (tentativa ${attempt}/18)."
            sleep 5
          done
          test "$ok" -eq 1
