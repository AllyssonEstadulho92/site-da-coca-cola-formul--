<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#f7f7f8" />
  <meta name="description" content="Aplicação de produtividade e catálogo técnico operacional de 53 equipamentos — protótipo público sem autenticação V5.0." />
  <title>Sistema de Registo de Avarias</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/equipment-catalog.css" />
  <link rel="stylesheet" href="css/equipment-images-v41.css" />
  <link rel="stylesheet" href="css/equipment-manual-v42.css" />
  <link rel="stylesheet" href="css/equipment-upload-hotfix.css" />
  <link rel="stylesheet" href="css/equipment-models-v43.css" />
  <link rel="stylesheet" href="css/equipment-v46.css" />
  <link rel="stylesheet" href="css/equipment-v5.css" />
</head>
<body>
  <noscript>Esta aplicação necessita de JavaScript ativo.</noscript>

  <div id="appShell" class="app-shell is-hidden">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="sidebar-brand">
        <div class="brand-mark small" aria-hidden="true">RA</div>
        <div class="sidebar-brand-copy">
          <strong>Sistema de Registo</strong>
          <span>Avarias · Produtividade</span>
        </div>
      </div>

      <nav id="desktopNav" class="nav-list"></nav>

      <div class="sidebar-footer">
        <div class="sync-pill" id="sidebarSyncStatus" data-status="synced">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Dados locais · protótipo</span>
        </div>
        <span class="build-label">V5.0 · catálogo técnico operacional</span>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div>
          <p id="topbarEyebrow" class="eyebrow">Área de trabalho</p>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div class="topbar-actions">
          <label class="global-search" aria-label="Pesquisa global">
            <span aria-hidden="true">⌕</span>
            <input id="globalSearch" type="search" placeholder="Pesquisar registo, cliente, REF, nota…" />
          </label>
          <button id="quickAddButton" class="btn btn-primary" type="button">+ Novo registo</button>
          <button id="profileButton" class="avatar-button" type="button" aria-label="Abrir identificação local"><span id="avatarInitials">UL</span></button>
        </div>
      </header>

      <div id="systemBanner" class="system-banner" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        <strong id="systemBannerTitle">Protótipo sem autenticação</strong>
        <span id="systemBannerText">Acesso direto neste dispositivo. Não utilize dados reais ou informação SAP neste site público.</span>
        <span class="save-state" id="saveState">Guardado</span>
      </div>

      <section id="viewContainer" class="view-container" tabindex="-1"></section>
    </main>

    <nav id="mobileNav" class="mobile-nav" aria-label="Navegação mobile"></nav>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <dialog id="confirmDialog" class="modal">
    <form method="dialog" class="modal-card">
      <div><p class="eyebrow">Confirmar ação</p><h3 id="confirmTitle">Tem a certeza?</h3><p id="confirmText" class="muted"></p></div>
      <div class="modal-actions"><button class="btn btn-secondary" value="cancel">Cancelar</button><button id="confirmActionButton" class="btn btn-danger" value="confirm">Confirmar</button></div>
    </form>
  </dialog>

  <dialog id="recordDialog" class="modal modal-wide">
    <form method="dialog" class="modal-card">
      <div id="recordDialogBody"></div>
      <div class="modal-actions"><button class="btn btn-secondary" value="close">Fechar</button></div>
    </form>
  </dialog>

  <input id="restoreInput" type="file" accept="application/json" hidden />

  <script src="js/core.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app-base.js"></script>
  <script src="js/app-utils.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/app-sw-refresh.js"></script>
  <script src="js/app-dashboard.js"></script>
  <script src="js/app-form-view.js"></script>
  <script src="js/app-form-logic.js"></script>
  <script src="js/app-form-save.js"></script>
  <script src="js/app-records.js"></script>
  <script src="js/app-record-detail.js"></script>
  <script src="js/app-record-archive.js"></script>
  <script src="js/app-directories.js"></script>
  <script src="js/equipment-data.js"></script>
  <script src="js/equipment-directory-v43.js"></script>
  <script src="js/app-equipment-catalog.js"></script>
  <script src="js/app-equipment-catalog-v4.js"></script>
  <script src="js/app-equipment-manual.js"></script>
  <script src="js/app-equipment-default-images.js"></script>
  <script src="js/app-equipment-reference-images-v46.js"></script>
  <script src="js/app-equipment-upload-hotfix.js"></script>
  <script src="js/app-equipment-models-v43.js"></script>
  <script src="js/app-equipment-ui-v46.js"></script>
  <script src="js/equipment/equipment-sources-v5.js"></script>
  <script src="js/equipment/equipment-symptoms-v5.js"></script>
  <script src="js/equipment/equipment-store-v5.js"></script>
  <script src="js/equipment/equipment-components-v5.js"></script>
  <script src="js/equipment/equipment-page-v5.js"></script>
  <script src="js/app-routing-views.js"></script>
  <script src="js/app-activity-productivity.js"></script>
  <script src="js/app-settings.js"></script>
  <script src="js/app-backup.js"></script>
  <script src="js/app-profile-help.js"></script>
  <script src="js/app-demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
